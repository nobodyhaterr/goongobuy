estimateur:()=>`<section class="sec"><h2>Estimateur de prix</h2><p class="lead">Poids, pays et ligne : le tarif s’affiche tout de suite.</p><br>${estimator()}</section>`,
suivi:()=>`<section class="sec"><h2>Suivi de colis</h2><p class="lead">Saisissez votre numéro de suivi GoonGoBuy (essayez GGB123456).</p><div class="bar"><input id="tn" placeholder="Numéro de suivi" aria-label="Numéro de suivi" onkeydown="if(event.key=='Enter')track()"><button class="btn" onclick="track()" style="flex:none">Suivre</button></div><div id="tr"></div></section>`,
apropos:()=>`<section class="sec"><h2>À propos de GoonGoBuy</h2><p class="lead">Nous sommes une équipe basée entre Yiwu et Shenzhen. Notre idée : rendre l’achat en Chine aussi simple que commander en ligne en France.</p><div class="grid"><div class="card"><div class="big">+1M</div>colis expédiés depuis 2019</div><div class="card"><div class="big">200+</div>pays desservis</div><div class="card"><div class="big">98 %</div>de clients satisfaits</div><div class="card"><div class="big">7j/7</div>support en français</div></div></section>`,
faq:()=>`<section class="sec"><h2>Questions fréquentes</h2>${[['Comment passer commande ?','Collez le lien de l’article ou choisissez-le dans la boutique, ajoutez-le au panier, puis payez. Nous nous occupons de l’achat.'],['Combien coûte la livraison ?','À partir de 4 €/kg selon la ligne choisie. Utilisez l’estimateur pour un tarif précis.'],['Combien de temps dure la livraison ?','Environ 8 jours en ligne Standard, 4 jours en Express.'],['Puis-je regrouper plusieurs articles ?','Oui. Vos articles sont stockés 90 jours gratuitement avant l’envoi groupé.'],['Que faire si mon colis est abîmé ?','Contactez le support avec des photos. Avec l’assurance, vous êtes remboursé.'],['Quels moyens de paiement ?','Carte bancaire, PayPal et portefeuille GoonGoBuy (démo uniquement ici).']].map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</section>`,
compte:()=>ST.user?`<section class="sec"><h2>Bonjour ${ST.user} 👋</h2><div class="dash"><div class="card"><span class="cat">Portefeuille</span><div class="big">${eur(ST.wallet)}</div><button class="btn sm" onclick="ST.wallet+=50;save();go();toast('+50 € ajoutés (démo)')">Recharger 50 €</button><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><p class="cat">Adresse de livraison<br>12 rue de la République<br>69002 Lyon, France</p><button class="btn ghost sm" onclick="ST.user=null;save();hdr();go()">Se déconnecter</button></div>
<div class="card sc"><h3>Mes commandes</h3>${ST.orders.length?`<table><tr><th>N°</th><th>Articles</th><th>Total</th><th>Statut</th></tr>${ST.orders.map(o=>`<tr><td>${o.id}</td><td>${o.n} art.</td><td>${eur(o.t)}</td><td>${o.s}</td></tr>`).join('')}</table>`:'<p class="cat">Aucune commande pour le moment. <a href="#boutique" style="color:var(--o)">Découvrir la boutique</a></p>'}</div></div></section>`
:`<div class="auth"><div class="tabs"><button class="chip on" id="t1" onclick="tab(1)">Connexion</button><button class="chip" id="t2" onclick="tab(2)">Inscription</button></div><div class="card"><input id="un" placeholder="Prénom" style="display:none" aria-label="Prénom"><input id="em" type="email" placeholder="E-mail" aria-label="E-mail"><input id="pw" type="password" placeholder="Mot de passe" aria-label="Mot de passe"><button class="btn" onclick="login()">Se connecter</button><span class="cat">Démo : n’importe quel e-mail fonctionne. −25 % offerts à l’inscription.</span></div></div>`};
let cat='Tout';
function shop(){const q=($('#q')?.value||'').toLowerCase(),cs=['Tout',...new Set(P.map(p=>p.c))];$('#cats').innerHTML=cs.map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat='${c}';shop()">${c}</button>`).join('');const l=P.filter(p=>(cat=='Tout'||p.c==cat)&&p.n.toLowerCase().includes(q));$('#pg').innerHTML=l.length?l.map(pc).join(''):'<p class="cat">Aucun article trouvé. Essayez un autre mot-clé.</p>'}
function tab(n){$('#t1').className='chip'+(n==1?' on':'');$('#t2').className='chip'+(n==2?' on':'');$('#un').style.display=n==2?'':'none';$('#app .btn').textContent=n==1?'Se connecter':'Créer mon compte'}
function login(){const e=$('#em').value.trim();if(!e)return toast('Saisissez un e-mail');ST.user=$('#un').value.trim()||e.split('@')[0];save();hdr();toast('Connecté');go()}
function track(){const n=$('#tn').value.trim();if(!n)return toast('Saisissez un numéro');let h=0;for(const c of n)h+=c.charCodeAt(0);const d=h%5+1,S=[['Commande passée','Paiement confirmé'],['Reçu à l’entrepôt','Yiwu, Chine'],['Contrôle qualité','Photos disponibles'],['Expédié','Départ de Shanghai'],['En livraison','Prise en charge en France'],['Livré','Remis en main propre']];
$('#tr').innerHTML=`<p><b>${n}</b></p><ul class="tl">${S.map((s,i)=>`<li class="${i<d?'d':''}"><b>${s[0]}</b><small>${i<d?s[1]:'En attente'}</small></li>`).join('')}</ul>`}
function cart(o){const d=$('#dr');d.classList.toggle('o',o);if(!o)return;const L=ST.cart.map(c=>({...P.find(p=>p.id==c.id),q:c.q})),sub=L.reduce((s,p)=>s+p.p*p.q,0),kg=L.reduce((s,p)=>s+p.w*p.q,0),sh=kg*5;
d.innerHTML=`<div style="display:flex;justify-content:space-between"><h2>Mon panier</h2><button class="ic" onclick="cart(0)" aria-label="Fermer">✕</button></div><div style="flex:1;overflow:auto">${L.length?L.map(p=>`<div class="ci">${art(p.t,p.k)}<div><b>${p.n}</b><br><span class="cat">${eur(p.p)} · ${p.w} kg</span></div><span class="q"><button onclick="qty(${p.id},-1)" aria-label="Moins">−</button> ${p.q} <button onclick="qty(${p.id},1)" aria-label="Plus">+</button></span></div>`).join(''):'<p class="cat">Votre panier est vide. Ajoutez des articles depuis la boutique.</p>'}</div>
<div><p>Sous-total : <b>${eur(sub)}</b><br>Livraison estimée (${kg.toFixed(1)} kg · 5 €/kg) : <b>${eur(sh)}</b><br>Total : <b class="price">${eur(sub+sh)}</b></p><button class="btn" style="width:100%" onclick="pay()">Passer la commande</button></div>`}
function add(id){const c=ST.cart.find(x=>x.id==id);c?c.q++:ST.cart.push({id,q:1});save();hdr();toast('Ajouté au panier');if($('#dr').classList.contains('o'))cart(1)}
function qty(id,d){const c=ST.cart.find(x=>x.id==id);c.q+=d;if(c.q<1)ST.cart=ST.cart.filter(x=>x.id!=id);save();hdr();cart(1)}
function pay(){if(!ST.cart.length)return toast('Panier vide');if(!ST.user){cart(0);location.hash='compte';return toast('Connectez-vous pour commander')}const t=ST.cart.reduce((s,c)=>{const p=P.find(x=>x.id==c.id);return s+(p.p+p.w*5)*c.q},0);ST.orders.unshift({id:'GGB'+(100000+Math.floor(Math.random()*899999)),n:ST.cart.reduce((s,c)=>s+c.q,0),t,s:'En préparation'});ST.cart=[];save();hdr();cart(0);toast('Commande confirmée (démo)');location.hash='compte';go()}
function hdr(){$('#cnt').textContent=ST.cart.reduce((s,c)=>s+c.q,0);$('#acc').textContent=ST.user?'👤 '+ST.user:'👤 Se connecter';$('#reg').style.display=ST.user?'none':''}
function go(){const h=location.hash.slice(1)||'accueil',k=R[h]?h:'accueil';$('#app').innerHTML=R[k]();$('#nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==k?'on':''}">${n[1]}</a>`).join('');if(k=='boutique')shop();if($('#er'))calc();hdr();scrollTo(0,0)}
addEventListener('hashchange',go);go();
</script></body></html>
